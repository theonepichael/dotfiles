# Set the prefix to Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Turn on mouse wheel scroll
set -g mouse on

# Enable and position status line
set -g status on
set -g status-position bottom
set -g status-interval 1

# Set history limit
set -g history-limit 5000

set-option -g default-shell /bin/zsh

# Reload .tmux.conf with Ctrl-a r
bind-key r source-file ~/.tmux.conf \; display-message 'Config reloaded!'

# Quick pane cycling with Ctrl-a Space
bind-key Space select-pane -t :.+

# Set easier window split keys
bind-key | split-window -h # vertical split
bind-key - split-window -v # horizontal split

# Vim-style navigation between panes using prefix + hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set pane and window index to start from 1
setw -g base-index 1
set -g pane-base-index 1

# Direct key bindings for different layouts
bind-key a select-layout even-vertical
bind-key S select-layout even-horizontal
bind-key t select-layout tiled

# Break current pain into a new window
bind-key b break-pane

# Resizing panes
bind-key -r C-Left resize-pane -L 2
bind-key -r C-Down resize-pane -D 2
bind-key -r C-Up resize-pane -U 2
bind-key -r C-Right resize-pane -R 2

# Copy mode settings
bind-key [ copy-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Set active pane border color
set -g pane-active-border-style fg=colour208

# Show a border on each pane with an arrow marking the active one
set -g pane-border-status top
set -g pane-border-indicators arrows

# Command to show keybindings
bind-key H split-window -h -p 50 "echo '\
prefix: C-a\n\
command mode: prefix + \":\"\n\
Do \"prefix\" + key to invoke commands\n\
r: Reload config\n\
[: Copy mode (vi)\n\
v: Begin selection in copy mode\n\
y: Yank in copy mode\n\
=====Panes-Management=====\n\
|: Create vertical split\n\
-: Create horizontal split\n\
Space: Cycle panes\n\
h/j/k/l: Navigate panes\n\
a: Vertical Layout - Split panes evenly side by side vertically\n\
S: Horizontal Layout - Split panes evenly side by side horizontally\n\
t: Tiled Layout - Arrange panes in a tiled, space-efficient manner\n\
b: Break current pane into a new window\n\
C-o/M-o (Alt-o): Rotate panes clockwise/counter-clockwise\n\
=====Windows-Management=====\n\
c: New window\n\
&: Close (kill) current window\n\
p: Previous window\n\
n: Next window\n\
,: Rename window\n\
w: List windows\n\
=====Session-Management=====\n\
Where \":\" is read as \"in command prompt mode\"\n\
(:)Create session => new-session -t <session-name>\n\
(:)Close session => kill-session -t <session-name>\n\
): Previous session\n\
(: Next session\n\
$: Rename session\n\
s: List sessions\n\
d: Detach from session\n\
H: Show this help\n\
?: (Shows default tmux help)\n\n\
Press any key to close this help...' && read -n 1 -s && tmux kill-pane"
# Enable yazi tui to render images correctly
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Status line customization
# Tint the status bar red when inside an SSH session. sshd exports
# SSH_CONNECTION only in the inbound shell; a tmux launched from that
# shell inherits it, so the config-source-time test below fires on the
# remote box and stays default-black on the local desktop. Paired with
# the oh-my-posh host segment in shell/.poshtheme.omp.json — same signal,
# independent surface. colour203 is the 256-cube match for #ff5555.
if-shell 'test -n "$SSH_CONNECTION"' \
  'set -g status-bg colour203; set -g status-fg black' \
  'set -g status-bg black; set -g status-fg white'
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=red],#[fg=green,bold]}Session:#S #[fg=yellow,bold]Window:#I #[fg=cyan,bold]Pane:#P #[fg=magenta]App:#{pane_current_command} #[fg=white,bold]Host:#H "
set -g status-right "#[fg=yellow,bold]%H:%M #[fg=green]%d-%b-%y"
