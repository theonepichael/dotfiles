# ~/.config/herdr/config.toml
onboarding = false

[keys]
prefix = "ctrl+a"

# --- Splits & Navigation (matching .tmux.conf |, -, h/j/k/l, Space) ---
# split_vertical = side-by-side (tmux split-window -h); split_horizontal = stacked
split_vertical = ["prefix+|", "prefix+v"]
split_horizontal = ["prefix+-", "prefix+u"]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+space"

# --- Pane Resizing (tmux prefix + Ctrl+Arrow; prefix form keeps shells' word-jump) ---
resize_pane_left = "prefix+ctrl+left"
resize_pane_down = "prefix+ctrl+down"
resize_pane_up = "prefix+ctrl+up"
resize_pane_right = "prefix+ctrl+right"

# --- Agent Cycling & Focus (alt-brackets; plain prefix+[ is copy mode, like tmux) ---
next_agent = "prefix+alt+]"
previous_agent = "prefix+alt+["
focus_agent = "prefix+alt+1..9"
open_notification_target = "prefix+o"

# --- Tabs & Panes (matching .tmux.conf c, &, ,, n, p) ---
new_tab = "prefix+c"
close_tab = ["prefix+&", "prefix+shift+x"]
rename_tab = ["prefix+,", "prefix+shift+t"]
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
close_pane = "prefix+x"
zoom = "prefix+z"

# --- Sidebar & Workspace Management ---
toggle_sidebar = "prefix+b"
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# --- General (matching .tmux.conf r, d, ?) ---
reload_config = "prefix+r"
detach = "prefix+d"
help = "prefix+?"

# --- Everforest Dark Palette (matches Neovim 'sainnhe/everforest') ---
[theme.custom]
sidebar_bg = "#232a2e"
active_row_bg = "#343f44"
selection_bg = "#3d484d"
panel_bg = "reset"
accent = "#a7c080"
red = "#e67e80"
green = "#a7c080"

[ui]
pane_borders = true
pane_gaps = true
agent_panel_sort = "priority"
status_indicators = "symbols"
tab_bar_right = [{ type = "hostname" }, { type = "datetime" }]
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "system"
delay_seconds = 0
