# links.toml — the dotfile symlink table read by install.py.
#
# Every entry is one `~`-rooted destination symlinked at a repo-relative
# source. Edit this file (not install.py) to add, move, or retire a
# mapping; install.py only owns the mechanics.
#
# Per-entry fields:
#   src              (required) repo-relative path to link from.
#   dest             (required) destination path; a leading `~/` is expanded
#                    against the invoking user's home at load time.
#   harness          (optional) only linked when this harness is named in
#                    --harness: claude, copilot, opencode, agy, or pi. Absent
#                    = linked regardless of harness selection.
#   platform         (optional) "mac" or "linux". Absent = both.
#   wsl              (optional) "exclude" to skip the entry under WSL,
#                    "only" to restrict it to WSL. Absent = neither matters.
#                    Used by the VS Code entries, whose real destination
#                    under WSL lives on the Windows side and is derived at
#                    run time from the `code` CLI on PATH (install.py).
#   profile_exclude  (optional) list of profiles the entry is skipped on,
#                    e.g. ["work"] for watchcommit, which auto-pushes to a
#                    personal remote and has no place on work hardware.
#   dir              (optional) true to glob `src` as a directory instead of
#                    linking it as one file: every file under it (recursive,
#                    skipping dotfiles and editor swap/backup junk) gets its
#                    own symlink under `dest`, and a file removed from `src`
#                    has its symlink cleaned up automatically on the next
#                    plain install. This is an *addition* mechanism, not an
#                    override one — a `dir=true` row producing the same
#                    destination as another entry aborts the run rather than
#                    silently picking a winner. Used for the Fidelity
#                    local-skill-fork mechanism (`local/...`, gitignored,
#                    profile_exclude = ["personal"]); absent = a normal
#                    single-file row.
#
# Order is preserved: entries are processed top to bottom, so the install
# log (and the rollback that replays it in reverse) reads in this order.
#
# Not here, because they need more than a static mapping — see install.py:
#   * ~/.claude/settings.json, ~/.config/opencode/opencode.jsonc, and
#     ~/.pi/agent/settings.json are copied once with drift reporting, never
#     symlinked (all three tools rewrite them in place, which would silently
#     detach a symlink), and pick a profile-specific seed.
#   * The WSL VS Code destination (Windows-side AppData), derived at run
#     time as described above.

# ── [[managed_dir]] ───────────────────────────────────────────────────────
#
# Declares a directory dotfiles owns *exclusively*: every file in it is
# expected to be produced by a [[link]] row, and --check-links reports
# anything else there under the `unmanaged` bucket. Exclusivity is opt-in on
# purpose — inferring it from each link's dest.parent surfaces 230 unmanaged
# entries to find 2 real ones, 68 of them in $HOME alone, because seven rows
# happen to land there.
#
# Fields:
#   dest    (required) the directory, "~"-relative exactly as a link's is.
#   ignore  (optional) list of filename glob patterns to ignore during
#           unmanaged audit (e.g. known third-party tools that drop files
#           into the directory).
#
# Only directories dotfiles genuinely owns belong here. Do not add:
#   * $HOME itself — seven rows land there among 68 unmanaged files.
#   * ~/.pi/agent — its 10 unmanaged entries are Pi runtime state
#     (sessions/, auth.json, settings.json, npm/).
#   * ~/.claude/output-styles — holds ELI5.md, which is not ours and may be
#     legitimately hand-written.
#
# These rows carry no gating fields of their own: a directory inherits the
# harness/platform/wsl/profile scoping of the [[link]] rows inside it, so
# --harness=claude does not audit a pi-only directory.

# ── common (both platforms, every harness) ───────────────────────────────

[[link]]
src = "vim/.vimrc"
dest = "~/.vimrc"

[[link]]
src = "nvim"
dest = "~/.config/nvim"

[[link]]
src = "zsh/.zshrc"
dest = "~/.zshrc"

[[link]]
src = "zsh/.common_shell_aliases"
dest = "~/.common_shell_aliases"

[[link]]
src = "shell/agent-tools.zsh"
dest = "~/.agent-tools.zsh"

[[link]]
src = "shell/.poshtheme.omp.json"
dest = "~/.poshtheme.omp.json"

[[link]]
src = "tmux/.tmux.conf"
dest = "~/.tmux.conf"

[[link]]
src = "alacritty/alacritty.toml"
dest = "~/.config/alacritty/alacritty.toml"

[[link]]
src = "herdr/config.toml"
dest = "~/.config/herdr/config.toml"


# ── Claude Code wiring ───────────────────────────────────────────────────

[[link]]
src = "claude/global-instructions.md"
dest = "~/.claude/CLAUDE.md"
harness = "claude"

# backlog-item orchestrates grill-me/second-opinion via each harness's native
# skill mechanism. opencode and Copilot CLI have ports; agy remains unported
# (description-match-only activation, mid-run delegation uncertain).
[[link]]
src = "claude/output-styles/PlainEngineer.md"
dest = "~/.claude/output-styles/PlainEngineer.md"
harness = "claude"


# ── shared scripts ───────────────────────────────────────────────────────
# Needed by Claude Code's hooks AND Copilot's AND opencode's hooks/skills
# (opencode's own dashboard.md/grill-me.md commands call these same paths),
# so these stay linked regardless of which harness(es) are selected.

[[link]]
src = "claude/scripts/dev_status_sync.py"
dest = "~/.claude/scripts/dev_status_sync.py"
profile_exclude = ["work"]

# Repo-maintenance tool rather than a harness runtime script, but it is linked
# like the rest so it can be run as ~/.claude/scripts/gen_interfaces.py; it
# resolves its own symlink to find the dotfiles checkout it documents. Kept
# post meta-agent-toolkit-migration-cutover: install.py itself needs its own
# local copy (repo-relative, not symlink-relative -- see install.py's own
# sys.path.insert comment), same as cli_common.py/settings_seed_drift_check.py
# below, so gen_interfaces.py stays too rather than moving to agent-toolkit
# exclusively.
[[link]]
src = "claude/scripts/gen_interfaces.py"
dest = "~/.claude/scripts/gen_interfaces.py"

[[link]]
src = "claude/scripts/gen_core_instructions.py"
dest = "~/.claude/scripts/gen_core_instructions.py"

# install.py's own dependency (import cli_common), not a harness-runtime
# script -- content is identical to agent-toolkit's copy today, so which
# repo's symlink actually wins this destination doesn't matter; dotfiles
# needs its own repo-tree copy regardless, since install.py always imports
# it from its own checkout, never via the live ~/.claude/scripts/ symlink.
[[link]]
src = "claude/scripts/cli_common.py"
dest = "~/.claude/scripts/cli_common.py"

# Same rationale as cli_common.py above: install.py's own dependency
# (from settings_seed_drift_check import _vscode_process_running).
[[link]]
src = "claude/scripts/settings_seed_drift_check.py"
dest = "~/.claude/scripts/settings_seed_drift_check.py"

# Pre-tool guard shared by all five harnesses: refuses a write into a repo's
# main checkout while a backlog item for that repo is in progress, and warns
# when a worktree's base is behind origin/main. Each harness has a thin
# adapter; the verdict logic lives only here.
# ── GitHub Copilot CLI wiring ────────────────────────────────────────────
# claude/global-instructions.md is deliberately the same file on both sides — the
# backlog/pending-items workflow prose is tool-agnostic, so there is no
# separate Copilot instructions file to maintain.

[[link]]
src = "claude/global-instructions.md"
dest = "~/.copilot/copilot-instructions.md"
harness = "copilot"

# The sessionStart hook is bash-only, so it is wired only on macOS/Linux
# (two same-destination platform entries, the same mutually-exclusive
# pattern as the VS Code entries below). It is deliberately not installed
# on Windows, where the bash handler would not dispatch.
# Same bash-only, mac/linux-only wiring as session-start.json above. Runs
# ruff format + ruff check --fix on any .py file the create/edit tools
# touch, inside a uv/ruff project (detected by walking up for
# pyproject.toml) -- same mechanism as the Claude Code PostToolUse hook.
# preToolUse guard. Probed 2026-09-01: Copilot honours the hook's EXIT CODE
# only -- a JSON deny verdict on exit 0 was ignored and the write went through
# -- and it surfaces no reason to the model beyond "hook exited with code 2".
# Details in copilot/CLAUDE_CODE_PARITY.md.
# ── opencode ─────────────────────────────────────────────────────────────
# AGENTS.md is intentionally unmanaged: opencode reads ~/.claude/CLAUDE.md
# directly as a global fallback, so a second copy of the same content under
# another path buys nothing but a duplicated file in every session's context.
#
# Two different questions, and conflating them produced a wrong "correction"
# here on 2026-08-30 that was reverted on 2026-08-31:
#   * PROJECT-level discovery targets AGENTS.md only. A CLAUDE.md sitting in
#     a project directory is never loaded. Probed against opencode 1.18.25
#     with a fixture repo holding both filenames at a root and a subdirectory,
#     each with a distinct token: only the AGENTS.md tokens came back.
#   * GLOBAL instructions still come from ~/.claude/CLAUDE.md. Probed the
#     same day by shadow-HOME bisection from a cwd with no AGENTS.md anywhere
#     up the tree: a HOME without .claude lost the content, and symlinking
#     .claude back in restored it.
# The first result does not imply the second. The 2026-08-30 edit assumed it
# did, declared the fallback dead, and added a redundant link here.
# See opencode/CLAUDE_CODE_PARITY.md §1.

# backlog-item delegates planning/critique through opencode's native skill
# tool, which only loads SKILL.md files — commands are invisible to it.
# These are the model-invoked copies of the two protocols; the user-typed
# /grill-me and /second-opinion commands above stay for muscle memory.
# tool.execute.after plugin -- runs ruff format + ruff check --fix on any
# .py file the edit/write tools touch, inside a uv/ruff project. Same
# mechanism as the Claude Code/Copilot/agy PostToolUse hooks; opencode's
# analog is a TypeScript plugin, not a declarative JSON hook (see
# opencode/CLAUDE_CODE_PARITY.md §5).
# tool.execute.before guard. opencode can throw or return and has nothing in
# between, so a "warn" verdict degrades to a silent allow here -- R3 is not
# surfaced on this harness.
# ── agy (Google Antigravity CLI, Gemini-backed) ──────────────────────────
# agy specifically looks for ~/.gemini/GEMINI.md and reads no CLAUDE.md at
# all, so it needs a real link of its own. Skills live under
# the current post-migration global path ~/.gemini/antigravity-cli/skills/,
# NOT the legacy bare ~/.gemini/skills/ — see agy/CLAUDE_CODE_PARITY.md.

[[link]]
src = "claude/global-instructions.md"
dest = "~/.gemini/GEMINI.md"
harness = "agy"

# Standalone hooks.json is discovered from ~/.gemini/config/hooks.json --
# a DIFFERENT root than skills (~/.gemini/antigravity-cli/skills/ above).
# Confirmed empirically: ~/.gemini/antigravity-cli/hooks.json and a
# plugins/<name>/hooks.json under that same root were both silently
# ignored at runtime despite `agy plugin validate` accepting the plugin
# shape; only ~/.gemini/config/hooks.json actually fired. See
# agy/CLAUDE_CODE_PARITY.md for the full probe record.
# ── Pi ───────────────────────────────────────────────────────────────────
# Pi looks specifically under ~/.pi/agent/ for its global instructions file
# (AGENTS.md, with CLAUDE.md read as a fallback name). It has no fallback to
# ~/.claude/CLAUDE.md, so it needs a real link of its own, same as agy's
# GEMINI.md link above. (opencode needs no such link -- it reads
# ~/.claude/CLAUDE.md directly.) Symlinked as AGENTS.md, not
# CLAUDE.md, since the doc names AGENTS.md first when both are considered
# for a directory. See pi/CLAUDE_CODE_PARITY.md §1.
#
# pi/skills/ holds all 8 skills generated by claude/scripts/gen_skills.py
# (dashboard, grill-me, backlog-item, make-skill, spec, standup, to-tickets)
# and claude/scripts/gen_second_opinion.py (second-opinion). pi/settings.json
# (copy-once seeded by install.py, not a plain link; see the top-of-file
# comment above) has no `skills` key -- all 8 are found purely through Pi's
# default, always-on scan of ~/.pi/agent/skills/, which this dir=true row
# symlinks straight to pi/skills/. An earlier `skills` array that listed
# pi/skills explicitly caused double-discovery (every skill resolving at
# two paths and colliding with itself); never reintroduce it. See
# pi/CLAUDE_CODE_PARITY.md §3.

[[link]]
src = "claude/global-instructions.md"
dest = "~/.pi/agent/AGENTS.md"
harness = "pi"

# ── watchcommit (personal machines only) ─────────────────────────────────
# It auto-pushes to a personal remote under your personal Claude account
# login, which has no place on work hardware.

[[link]]
src = "scripts/watchcommit.py"
dest = "~/.local/bin/watchcommit"
profile_exclude = ["work"]

[[link]]
src = "scripts/wc-guard"
dest = "~/.local/bin/wc-guard"
profile_exclude = ["work"]

[[link]]
src = "systemd/watchcommit.service"
dest = "~/.config/systemd/user/watchcommit.service"
platform = "linux"
profile_exclude = ["work"]

[[link]]
src = "launchd/com.user.watchcommit.plist"
dest = "~/Library/LaunchAgents/com.user.watchcommit.plist"
platform = "mac"
profile_exclude = ["work"]

# ── opencode-skills-sync (personal machines only) ─────────────────────────
# Mirrors ~/.config/opencode/skills into a commit-only local branch so a
# skill authored directly there isn't lost if it's later deleted without
# ever being promoted into dotfiles/opencode/skills. Never pushes.

[[link]]
src = "scripts/opencode_skills_sync.py"
dest = "~/.local/bin/opencode-skills-sync"
platform = "linux"
profile_exclude = ["work"]

[[link]]
src = "systemd/opencode-skills-sync.service"
dest = "~/.config/systemd/user/opencode-skills-sync.service"
platform = "linux"
profile_exclude = ["work"]

[[link]]
src = "claude/scripts/watchcommit_activity.py"
dest = "~/.claude/scripts/watchcommit_activity.py"
profile_exclude = ["work"]

[[link]]
src = "claude/scripts/opencode_skills_sync_activity.py"
dest = "~/.claude/scripts/opencode_skills_sync_activity.py"
profile_exclude = ["work"]

# ── macOS-only configs ───────────────────────────────────────────────────
# .zprofile carries the Homebrew shellenv (mac-only). Secrets and NVM are
# sourced from .zshrc unconditionally, on every platform.

[[link]]
src = "zsh/.zprofile"
dest = "~/.zprofile"
platform = "mac"

[[link]]
src = "karabiner/karabiner.json"
dest = "~/.config/karabiner/karabiner.json"
platform = "mac"

# ── VS Code ──────────────────────────────────────────────────────────────
# Not mac-only: VS Code runs on Linux and WSL too, just at a different
# config path per OS. The WSL destination is Windows-side and derived at
# run time, so those two entries are excluded here and handled in
# install.py.

[[link]]
src = "vscode/settings.json"
dest = "~/Library/Application Support/Code/User/settings.json"
platform = "mac"

[[link]]
src = "vscode/keybindings.json"
dest = "~/Library/Application Support/Code/User/keybindings.json"
platform = "mac"

[[link]]
src = "vscode/settings.json"
dest = "~/.config/Code/User/settings.json"
platform = "linux"
wsl = "exclude"

[[link]]
src = "vscode/keybindings.json"
dest = "~/.config/Code/User/keybindings.json"
platform = "linux"
wsl = "exclude"

# meta-agent-toolkit-migration-cutover: dropped both [[managed_dir]]
# declarations that used to live here (~/.claude/scripts,
# ~/.pi/agent/extensions) -- dotfiles is no longer the majority/exclusive
# owner of either directory post-cutover (agent-toolkit's own links.toml
# now declares ~/.claude/scripts exclusive, with an ignore list for the
# handful of destinations that stay dotfiles-only permanently). See
# meta-agent-toolkit-handover-safety's managed-dir-resolution decision.
