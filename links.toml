src = "claude/scripts/watchcommit_activity.py"
dest = "~/.claude/scripts/watchcommit_activity.py"
profile_exclude = ["work"]

[[link]]
src = "claude/scripts/opencode_skills_sync_activity.py"
dest = "~/.claude/scripts/opencode_skills_sync_activity.py"
profile_exclude = ["work"]

[[link]]
src = "claude/scripts/statusline.py"
dest = "~/.claude/scripts/statusline.py"

# ── macOS-only configs ───────────────────────────────────────────────────
# .zprofile carries the Homebrew shellenv (mac-only). Secrets and NVM are
# sourced from .zshrc unconditionally, on every platform.

[[link]]
src = "zsh/.zprofile"
dest = "~/.zprofile"
platform = "mac"

[[link]]
src = "karabiner/karabiner.json"
dest = "~/.config/karabiner/karabiner.json"
platform = "mac"

# ── VS Code ──────────────────────────────────────────────────────────────
# Not mac-only: VS Code runs on Linux and WSL too, just at a different
# config path per OS. The WSL destination is Windows-side and derived at
# run time, so those two entries are excluded here and handled in
# install.py.

[[link]]
src = "vscode/settings.json"
dest = "~/Library/Application Support/Code/User/settings.json"
platform = "mac"

[[link]]
src = "vscode/keybindings.json"
dest = "~/Library/Application Support/Code/User/keybindings.json"
platform = "mac"

[[link]]
src = "vscode/settings.json"
dest = "~/.config/Code/User/settings.json"
platform = "linux"
wsl = "exclude"

[[link]]
src = "vscode/keybindings.json"
dest = "~/.config/Code/User/keybindings.json"
platform = "linux"
wsl = "exclude"

# ── exclusive directories (audited by --check-links) ─────────────────────

[[managed_dir]]
dest = "~/.claude/scripts"

[[managed_dir]]
dest = "~/.pi/agent/extensions"
