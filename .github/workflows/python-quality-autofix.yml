name: Python quality autofix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked development tools
        run: uv sync --locked --dev

      - name: Apply safe Ruff fixes
        run: |
          uv run ruff check . --fix
          uv run ruff format .

      - name: Verify the fixed tree
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run --with pytest pytest test/test_install.py test/test_lint.py

      - name: Open an autofix pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/python-quality-autofix
          delete-branch: true
          commit-message: "chore(lint): apply automated Ruff fixes"
          title: "chore(lint): apply automated Ruff fixes"
          body: |
            Applies safe Ruff lint and formatting fixes generated by the scheduled or manually dispatched quality workflow.

            The regular Python quality workflow still runs these checks independently.
