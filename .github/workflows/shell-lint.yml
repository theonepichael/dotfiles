name: Shell lint

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "scripts/export_for_print.sh"
      - "scripts/export_for_print_trimmed.sh"
      - "test/run.sh"
      - "test/scenarios.sh"
      - "test/lint_shell.sh"
      - ".github/workflows/shell-lint.yml"
  pull_request:
    paths:
      - "install.sh"
      - "scripts/export_for_print.sh"
      - "scripts/export_for_print_trimmed.sh"
      - "test/run.sh"
      - "test/scenarios.sh"
      - "test/lint_shell.sh"
      - ".github/workflows/shell-lint.yml"

permissions:
  contents: read

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run shell lint
        run: ./test/lint_shell.sh
